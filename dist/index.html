<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Folio — Markdown editor</title><meta name="description" content="Your quiet space to write Markdown. Create, import, edit, save and export your documents."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23252c43'/%3E%3Cpath d='M10 24V8h13v3H14v4h8v3h-8v6' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><aside><a class="brand" href="./"><span class="logo">f.</span> folio<span class="badge">MD</span></a><button class="new primary" id="new">＋ New document</button><div class="section-label">YOUR DOCUMENTS <span id="doc-count">1</span></div><nav id="documents" aria-label="Documents"></nav><div class="sidebar-bottom"><button id="open-draft" aria-label="Open a draft from the drafts repo">⇣ <span>Open draft</span></button><button id="import" aria-label="Open or import Markdown files">↥ <span>Import Markdown</span></button><p>Drafts autosave in this browser.<br>Save writes to a chosen file.</p></div></aside><main><header><div class="filename"><span class="file-icon">▤</span><input id="title" aria-label="Document filename" value="Welcome.md"><span id="saved" role="status">Saved locally</span></div><div class="actions"><button id="save" title="Save to a file (Ctrl+S)">Save <kbd>Ctrl S</kbd></button><button id="save-as" title="Choose another file (Ctrl+Shift+S)">Save as…</button><button id="export" class="primary">Export .md <span>↗</span></button></div></header><div class="workspace-bar"><div class="tabs" aria-label="Editor view"><button data-mode="edit">Editor</button><button data-mode="split" class="active">Split view</button><button data-mode="preview">Preview</button></div><span class="quiet">A little space for your next idea.</span></div><div class="formatbar" aria-label="Formatting"><!-- Three heading levels for article structure. -->
<button data-format="h1" title="Heading 1">H₁</button><button data-format="h2" title="Heading 2">H₂</button><button data-format="h3" title="Heading 3">H₃</button><button data-format="bold" title="Bold"><b>B</b></button><button data-format="italic" title="Italic"><i>I</i></button><button data-format="strike" title="Strikethrough"><s>S</s></button><button data-format="inline" title="Inline code">&#96;</button><span></span><button data-format="link" title="Insert link">↗ Link</button><button data-format="list" title="Bulleted list">☷ List</button><button data-format="ordered" title="Numbered list">1. List</button><button data-format="quote" title="Blockquote">❞</button><button data-format="code" title="Code block">&lt;/&gt;</button><button data-format="divider" title="Divider">—</button><div class="format-hint">Markdown, made simple</div></div><div class="panes" data-mode="split"><section class="editor-pane"><div class="pane-label">MARKDOWN <span>Plain text, endless possibilities</span></div><textarea id="editor" spellcheck="false" aria-label="Markdown editor"></textarea></section><section class="preview-pane"><div class="pane-label">LIVE PREVIEW <span>Updates as you write</span></div><article id="preview"></article></section></div><footer><span><span class="dot"></span> <span id="words">0 words</span><span class="separator">/</span><span id="chars">0 characters</span></span><span>Markdown <span class="separator">/</span> UTF-8</span></footer></main><input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden><dialog id="drafts-dialog" aria-label="Open draft"><form method="dialog"><p class="section-label">DRAFTS</p><ul id="drafts-list"></ul><button value="cancel">Cancel</button></form></dialog><div id="toast" role="status"></div><script src="marked.umd.js"></script><script src="purify.min.js"></script><script src="front-matter.js"></script><script src="file-saving.js"></script><script src="drafts.js"></script><script src="app.js"></script></body></html>
